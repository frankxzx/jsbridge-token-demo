<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Smart+ local debug</title>
<style>
  body { font: 15px -apple-system, Segoe UI, sans-serif; margin: 32px; color: #222; }
  a { word-break: break-all; }
  button { margin-top: 12px; padding: 8px 14px; }
</style>
</head>
<body>
<p id="msg">Opening local Smart+ debug…</p>
<p><a id="link" href="#"></a></p>
<button type="button" id="copy" hidden>Copy link</button>
<script>
'use strict';
// Fixed target: this page only ever redirects to the local debug page.
var LOCAL_URL = 'http://localhost:6002/agent/debug/smartPlus';

function fromB64Url(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  return atob(s);
}

(function () {
  var d = location.hash.slice(1);
  // Drop the tokens from the address bar and history
  history.replaceState(null, '', location.pathname + location.search);
  var msg = document.getElementById('msg');
  var data;
  try { data = JSON.parse(fromB64Url(d || '')); } catch (e) { data = null; }
  if (!data || typeof data.f !== 'string' || typeof data.n !== 'string') {
    msg.textContent = 'Link is invalid or incomplete.';
    return;
  }
  var u = new URL(LOCAL_URL);
  u.searchParams.set('fr_token', data.f);
  u.searchParams.set('nct', data.n);
  var target = u.toString();

  var a = document.getElementById('link');
  a.href = target; a.textContent = target;
  var btn = document.getElementById('copy');
  btn.hidden = false;
  btn.onclick = function () {
    navigator.clipboard.writeText(target).then(function () { btn.textContent = 'Copied'; });
  };
  msg.textContent = 'If nothing happens, open or copy the link below.';
  location.replace(target);
})();
</script>
</body>
</html>
